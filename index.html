<style>

/* Layout: logo fixa, título discreto, abas de coleção, grade de capas limpa; ao tocar numa capa abre uma tela com pergunta do miolo e depois galeria */
:root {
  --bg: #f8f7f4;
  --surface: #ffffff;
  --ink: #14213d;
  --muted: #666d7e;
  --line: #e4e1da;
  --gold: #8a6a2f;
  --brand: #14213d;
  --wa: #128c4a;
  --wa-press: #0e7a3f;
  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522; --surface: #172033; --ink: #f1eee7; --muted: #9aa3b5; --line: #263049; --gold: #d1ad6f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522; --surface: #172033; --ink: #f1eee7; --muted: #9aa3b5; --line: #263049; --gold: #d1ad6f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.page { max-width: 960px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
img { display: block; max-width: 100%; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rd { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
button { font: inherit; }

/* cabeçalho */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--bg); padding-block: 10px 8px; }
.brandbar { background: var(--brand); border-radius: 12px; padding: 8px 18px; display: flex; align-items: center; }
.logo { height: 40px; width: auto; }

/* categorias, coleções e abas */
.cats { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 24px; }
.cat { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.1; color: var(--muted); padding-bottom: 6px; border-bottom: 2px solid transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input:checked + .cat { color: var(--ink); border-bottom-color: var(--gold); }
input:focus-visible + .cat, input:focus-visible + .tab { outline: 3px solid var(--gold); outline-offset: 4px; }
.tabs { display: none; flex-wrap: wrap; gap: 4px 22px; margin-top: 20px; }
.tab { font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.1; color: var(--muted); padding-bottom: 4px; border-bottom: 2px solid transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input:checked + .tab { color: var(--ink); border-bottom-color: var(--gold); }
.colecao, .soon { display: none; }
.meta { margin: 10px 0 26px; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.soon { margin-top: 34px; gap: 10px; justify-items: start; max-width: 420px; }
.soon .t { font-family: var(--font-display); font-size: 28px; font-weight: 600; }
.soon p { color: var(--muted); }
.soon .wbtn { margin-top: 8px; min-height: 50px; }

/* grade de capas */
.capas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 16px; }
@media (min-width: 600px) { .capas { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 22px; } }
@media (min-width: 860px) { .capas { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.capa { display: grid; gap: 10px; align-content: start; cursor: pointer; min-width: 0; -webkit-tap-highlight-color: transparent; }
.capa img { width: 100%; height: auto; aspect-ratio: 1070 / 1470; border-radius: 6px; background: var(--line); box-shadow: 0 14px 26px -14px rgba(20, 33, 61, .5); transition: transform .25s ease; }
.capa:hover img { transform: translateY(-3px); }
.capa:active img { transform: scale(.985); }
.num { font-size: 11px; font-weight: 700; letter-spacing: .22em; color: var(--gold); }
.nm { font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.1; }
.capa .cap-txt { display: grid; gap: 3px; padding-inline: 2px; }

/* tela da capa */
.ov { display: none; position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); }
.ov-in { max-width: 480px; min-height: 100%; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-rows: auto 1fr auto; }
.ov-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 8px 0; background: var(--bg); }
.back { appearance: none; border: 0; background: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px 0 0; font-weight: 500; font-size: 15px; cursor: pointer; }
.back:focus-visible, .swap:focus-visible, .confirm:focus-visible, .wbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.ov-col { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.ov-body { display: grid; gap: 22px; align-content: start; padding-block: 8px 24px; }
.ov-cover { width: min(46%, 190px); height: auto; margin: 0 auto; border-radius: 6px; aspect-ratio: 1070 / 1470; box-shadow: 0 22px 36px -18px rgba(20, 33, 61, .55); }
.ov-name { display: grid; gap: 4px; justify-items: center; text-align: center; }
.ov-name .nm { font-size: 32px; }
.ask { display: grid; gap: 6px; text-align: center; }
.ask h2 { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.1; }
.ask p { color: var(--muted); font-size: 15px; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; padding: 16px 18px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.opt .t { font-size: 17px; font-weight: 700; }
.opt .d { grid-column: 1; font-size: 14px; color: var(--muted); }
.opt::after { content: ""; grid-column: 2; grid-row: 1 / span 2; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); }
.bottom { position: sticky; bottom: 0; z-index: 3; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 22%); }
.confirm { display: flex; justify-content: center; align-items: center; min-height: 54px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }

/* galeria depois de confirmar */
.vg { display: none; }
.gal { position: relative; width: min(100%, 360px); margin: 0 auto; }
.slides { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; aspect-ratio: 3 / 4; border-radius: 8px; box-shadow: 0 22px 36px -18px rgba(20, 33, 61, .55); background: var(--surface); }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; position: relative; scroll-snap-align: start; min-width: 0; height: 100%; }
.slide img { width: 100%; height: 100%; object-fit: cover; }
.sl-mio { display: none; }
.sl-mio img { object-fit: contain; background: #fff; }
.chip { position: absolute; bottom: 12px; left: 12px; z-index: 2; padding: 4px 10px; border-radius: 999px; background: rgba(15, 21, 34, .72); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.nav { display: none; position: absolute; top: 50%; z-index: 3; translate: 0 -50%; width: 38px; height: 38px; padding: 0; place-items: center; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .94); color: #14213d; font-size: 24px; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); -webkit-tap-highlight-color: transparent; }
.nav:hover { background: #fff; }
.nav:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.nav.prev { left: 8px; }
.nav.next { right: 8px; }
.js .nav { display: grid; }
.js .nav[hidden] { display: none; }
.dots { display: flex; justify-content: center; gap: 7px; margin-top: 14px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.js .dots i { cursor: pointer; }
.dots i.on { background: var(--gold); }
.sum { display: grid; gap: 4px; justify-items: center; text-align: center; }
.sum .pick { font-size: 17px; font-weight: 700; }
.sum .spec { font-size: 14px; color: var(--muted); letter-spacing: .03em; }
.v, .wbtn.combo { display: none; }
.swap { appearance: none; border: 0; background: none; padding: 6px 4px; margin-top: 2px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.wbtn { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 54px; padding: 0 22px; border-radius: 12px; background: var(--wa); color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.wbtn:active { background: var(--wa-press); }


/* estados controlados pelo script */
[hidden] { display: none !important; }
.tabs.on { display: flex; }
.colecao.on { display: block; }
.soon.on { display: grid; }
html.lock { overflow: hidden; }
.ov.open { display: block; }
.ov .vg { display: none; }
.ov.done .vq { display: none; }
.ov.done .vg { display: block; }
.opt { text-align: left; width: 100%; font: inherit; color: inherit; }
.opt.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.opt.sel::after { border-color: var(--gold); background: radial-gradient(circle, var(--gold) 0 46%, transparent 50%); }
.opt:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.confirm { width: 100%; border: 0; }
.confirm[disabled] { opacity: .35; pointer-events: none; }
.capa { appearance: none; border: 0; background: none; padding: 0; text-align: left; color: inherit; font: inherit; }
.capa:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; border-radius: 6px; }
.capa img { object-fit: cover; }
.state { margin-top: 40px; color: var(--muted); }
.stack { display: grid; gap: 22px; }
/* abas numa linha só, deslizando */
.cats, .tabs.on { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-right: -16px; padding-right: 16px; }
.cats::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
.cat, .tab { white-space: nowrap; flex: 0 0 auto; }
/* fileiras estilo Netflix */
.row { margin: 4px 0 28px; }
.rh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.rh h2 { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.1; margin: 0; }
.more { appearance: none; border: 0; background: none; padding: 6px 0; font: inherit; font-size: 13px; font-weight: 700; color: var(--gold); cursor: pointer; white-space: nowrap; }
.more:focus-visible, .back2:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.rs { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-right: -16px; padding: 0 16px 14px 0; }
.rs::-webkit-scrollbar { display: none; }
.rs .capa { flex: 0 0 38%; scroll-snap-align: start; }
@media (min-width: 600px) { .rs .capa { flex-basis: 23%; } }
@media (min-width: 860px) { .rs .capa { flex-basis: 18%; } }
.rs .nm { font-size: 17px; }
/* em telas largas as fileiras não passam da largura do topo */
@media (min-width: 992px) { .cats, .tabs.on, .rs { margin-right: 0; padding-right: 0; } }
.gview .rh { margin-bottom: 18px; }
.back2 { appearance: none; border: 0; background: none; padding: 6px 0; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }

/* ---- abertura com parallax ---- */
.pxh{position:relative;height:260px;margin:0 -16px;overflow:hidden;background:radial-gradient(130% 100% at 50% 0%,#21315a 0%,#14213d 55%,#0c1526 100%);isolation:isolate}
.L1{position:absolute;inset:-40px -20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:center;opacity:.38;filter:blur(1.5px) saturate(.9);will-change:transform}
.L1 img{width:100%;aspect-ratio:1070/1470;object-fit:cover;border-radius:8px}
.L1 img:nth-child(odd){transform:translateY(30px)}
.pxh::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(20,33,61,.55) 0%,rgba(20,33,61,.7) 50%,rgba(12,21,38,.92) 100%)}
.L2{position:absolute;inset:-60px 0;z-index:1;will-change:transform;opacity:.55;
 background-image:radial-gradient(1.4px 1.4px at 12% 22%,#e3c48a 50%,transparent 51%),radial-gradient(1px 1px at 78% 18%,#e3c48a 50%,transparent 51%),radial-gradient(1.6px 1.6px at 64% 64%,#d1ad6f 50%,transparent 51%),radial-gradient(1px 1px at 30% 72%,#e3c48a 50%,transparent 51%),radial-gradient(1.2px 1.2px at 88% 52%,#d1ad6f 50%,transparent 51%),radial-gradient(1px 1px at 46% 38%,#f0dcae 50%,transparent 51%),radial-gradient(1.3px 1.3px at 6% 58%,#d1ad6f 50%,transparent 51%),radial-gradient(1px 1px at 56% 88%,#e3c48a 50%,transparent 51%);
 animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:.7}}
.L3{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;will-change:transform,opacity}
.L3 .lg{height:64px;width:auto;animation:lgIn 1.2s cubic-bezier(.2,.7,.2,1) both}
.orn{display:flex;align-items:center;gap:10px;width:58%;color:#d1ad6f}
.orn span{flex:1;height:1px;background:linear-gradient(90deg,transparent,#d1ad6f,transparent);animation:lineIn 1.2s .4s cubic-bezier(.2,.7,.2,1) both}
.orn i{font-style:normal;font-size:10px;animation:fadeIn .8s .9s both}
.tg{margin:0;font-size:10.5px;letter-spacing:.34em;font-weight:700;color:#d1ad6f;animation:fadeIn 1s 1s both}
.bar{position:fixed;top:0;left:0;right:0;z-index:8;height:calc(env(safe-area-inset-top,0px) + 60px);padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;background:rgba(20,33,61,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px -18px rgba(0,0,0,.7);opacity:0;transform:translateY(-100%);transition:opacity .35s,transform .35s cubic-bezier(.2,.7,.2,1)}
.bar img{height:32px;width:auto}
.bar.on{opacity:1;transform:none}
@keyframes lgIn{from{opacity:0;filter:blur(8px);transform:translateY(8px) scale(.96)}to{opacity:1;filter:none;transform:none}}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cats{margin-top:22px}
@media (min-width: 992px){.pxh{margin:12px 0 0;border-radius:14px;height:240px}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.row .rh{will-change:transform}
@media (prefers-reduced-motion: reduce){.L2,.L3 .lg,.orn span,.orn i,.tg{animation:none}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div class="page">
<div class="bar" id="bar" aria-hidden="true"><img src="/img/logo.webp" alt="" width="131" height="32"></div>

<script>
(function () {
  "use strict";
  var WA_SVG = "<svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" aria-hidden=\"true\" focusable=\"false\" fill=\"currentColor\"><path d=\"M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.38A9.9 9.9 0 1 0 12.04 2zm0 1.8a8.1 8.1 0 0 1 0 16.2 8.1 8.1 0 0 1-4.13-1.13l-.3-.17-3.12.82.83-3.04-.2-.31A8.1 8.1 0 0 1 12.04 3.8zm-3.2 4.3c-.16 0-.42.06-.64.3-.22.25-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.66 2.65 4.1 3.6 2.03.8 2.44.64 2.88.6.44-.04 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.1-.49.1-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.46-.4-.4-.54-.4z\"/></svg>";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var slug = function (s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); };
  var pad = function (n) { return n < 10 ? "0" + n : String(n); };
  var local = /^(localhost|127\.|\[::1\])/.test(location.hostname) || location.protocol === "file:";
  function img(src, w) {
    if (!src) return "";
    if (local || /^https?:/.test(src)) return src;
    return "/.netlify/images?url=" + encodeURIComponent(src) + "&w=" + w + "&q=82";
  }
  function fallback(el, src) { el.onerror = function () { el.onerror = null; el.src = src; }; }
  function getJSON(u) { return fetch(u, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(u); return r.json(); }); }

  var cfg = {}, cats = [], cols = [], cur = null;

  Promise.all([getJSON("/data/config.json"), getJSON("/data/categorias.json"), getJSON("/data/colecoes.json")])
    .then(function (r) {
      cfg = r[0] || {};
      cats = (r[1] && r[1].categorias) || [];
      cols = ((r[2] && r[2].colecoes) || []).filter(function (c) { return c && c.publicada !== false && c.nome; });
      cols.forEach(function (c) { c.id = slug(c.nome); c.capas = (c.capas || []).filter(function (x) { return x && x.imagem; }); c.miolos = (c.miolos || []).filter(function (m) { return m && m.titulo; }); });
      render();
    })
    .catch(function () { $("state").textContent = "Não foi possível carregar o catálogo. Atualize a página."; });

  function wa(text) { return "https://wa.me/" + String(cfg.whatsapp || "").replace(/\D/g, "") + "?text=" + encodeURIComponent(text); }

  function render() {
    $("state").hidden = true;
    var catsEl = $("cats"), colsEl = $("cols"), h = "", b = "";
    cats.forEach(function (cat, i) {
      var cid = slug(cat.nome), list = cols.filter(function (c) { return c.categoria === cat.nome; });
      h += '<input class="rd" type="radio" name="categoria" id="cat-' + cid + '" value="' + cid + '"' + (i === 0 ? " checked" : "") + '><label class="cat" for="cat-' + cid + '">' + esc(cat.nome) + "</label>";
      if (list.length) {
        b += '<div class="tabs" data-cat="' + cid + '" role="group" aria-label="Coleções">';
        list.forEach(function (c, j) { b += '<input class="rd" type="radio" name="col-' + cid + '" id="col-' + c.id + '" value="' + c.id + '"' + (j === 0 ? " checked" : "") + '><label class="tab" for="col-' + c.id + '">' + esc(c.nome) + "</label>"; });
        b += "</div>";
        list.forEach(function (c) {
          var meta = [c.especificacao, c.capas.length + " " + (c.rotulo_item || "Capa").toLowerCase() + (c.capas.length === 1 ? "" : "s")].filter(Boolean).join(" · ");
          b += '<section class="colecao" data-cat="' + cid + '" data-col="' + c.id + '" aria-label="' + esc(c.nome) + '"><p class="meta">' + esc(meta) + "</p>";
          var grupos = [];
          c.capas.forEach(function (x) { if (x.grupo && grupos.indexOf(x.grupo) < 0) grupos.push(x.grupo); });
          if (grupos.length) {
            grupos.forEach(function (g, gi) {
              var idx = []; c.capas.forEach(function (x, k) { if (x.grupo === g) idx.push(k); });
              b += '<div class="row"><div class="rh"><h2>' + esc(g) + '</h2><button type="button" class="more" data-col="' + c.id + '" data-g="' + esc(g) + '">Ver todas (' + idx.length + ') ›</button></div><div class="rs">';
              idx.forEach(function (k, n) { b += card(c, k, 360, gi === 0 && n < 3); });
              b += "</div></div>";
            });
            b += '<div class="gview" hidden></div>';
          } else {
            b += '<div class="capas">';
            c.capas.forEach(function (x, k) { b += card(c, k, 480, false); });
            b += "</div>";
          }
          b += "</section>";
        });
      } else {
        var msg = cat.mensagem_em_breve || "Estamos preparando novidades por aqui. Quer saber mais? Fale com a gente.";
        b += '<section class="soon" data-cat="' + cid + '" aria-label="' + esc(cat.nome) + '"><p class="t">Em breve</p><p>' + esc(msg) + '</p><a class="wbtn" target="_blank" rel="noopener" href="' + esc(wa("Olá! Quero saber mais sobre " + cat.nome.toLowerCase() + ".")) + '">' + WA_SVG + "<span>Falar no WhatsApp</span></a></section>";
      }
    });
    catsEl.innerHTML = h; colsEl.innerHTML = b;
    colsEl.querySelectorAll("img[data-src]").forEach(function (el) { fallback(el, el.getAttribute("data-src")); });
    watch(colsEl);
    document.addEventListener("change", function (e) { if (e.target.name === "categoria" || /^col-/.test(e.target.name)) show(); });
    colsEl.addEventListener("click", function (e) {
      var b = e.target.closest(".capa"); if (b) { open(b.getAttribute("data-col"), +b.getAttribute("data-i"), true); return; }
      var m = e.target.closest(".more"); if (m) { showGroup(m.closest(".colecao"), m.getAttribute("data-col"), m.getAttribute("data-g")); return; }
      var k = e.target.closest(".back2"); if (k) showGroup(k.closest(".colecao"), null, null);
    });
    show();
    var m = /^#(.+)-(\d+)$/.exec(location.hash);
    if (m) { var c0 = cols.filter(function (c) { return c.id === m[1]; })[0]; if (c0 && c0.capas[m[2] - 1]) { selectCol(c0); open(c0.id, m[2] - 1, false); } }
  }

  function card(c, k, w, eager) {
    var x = c.capas[k];
    var src = esc(img(x.imagem, w));
    return '<button type="button" class="capa" data-col="' + c.id + '" data-i="' + k + '"><img ' + (eager ? 'src="' + src + '"' : 'src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-lazy="' + src + '"') + ' data-src="' + esc(x.imagem) + '" width="420" height="577" alt="' + esc(c.rotulo_item || "Capa") + ' ' + pad(k + 1) + ", " + esc(x.nome) + '"' + (eager ? ' fetchpriority="high"' : "") + ' decoding="async"><span class="cap-txt"><span class="num">' + pad(k + 1) + '</span><span class="nm">' + esc(x.nome) + "</span></span></button>";
  }
  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { var el = e.target; el.src = el.getAttribute("data-lazy"); el.removeAttribute("data-lazy"); io.unobserve(el); } });
  }, { rootMargin: "300px 200px 300px 200px" }) : null;
  function watch(root) {
    root.querySelectorAll("img[data-lazy]").forEach(function (el) {
      if (io) io.observe(el); else { el.src = el.getAttribute("data-lazy"); el.removeAttribute("data-lazy"); }
    });
  }
  function showGroup(sec, colId, g) {
    var c = cols.filter(function (x) { return x.id === colId; })[0], gv = sec.querySelector(".gview");
    if (!g) { gv.hidden = true; gv.innerHTML = ""; sec.querySelectorAll(".row").forEach(function (r) { r.hidden = false; }); return; }
    var h = '<div class="rh"><h2>' + esc(g) + '</h2><button type="button" class="back2">‹ Ver todas as fileiras</button></div><div class="capas">';
    c.capas.forEach(function (x, k) { if (x.grupo === g) h += card(c, k, 480, false); });
    gv.innerHTML = h + "</div>"; gv.hidden = false;
    gv.querySelectorAll("img[data-src]").forEach(function (el) { fallback(el, el.getAttribute("data-src")); });
    watch(gv);
    sec.querySelectorAll(".row").forEach(function (r) { r.hidden = true; });
    sec.scrollIntoView({ block: "start" }); window.scrollBy(0, -70);
  }

  function selectCol(c) {
    var ci = document.getElementById("cat-" + slug(c.categoria)); if (ci) ci.checked = true;
    var t = document.getElementById("col-" + c.id); if (t) t.checked = true;
    show();
  }

  function show() {
    var cat = (document.querySelector('input[name="categoria"]:checked') || {}).value;
    document.querySelectorAll(".tabs").forEach(function (t) { t.classList.toggle("on", t.getAttribute("data-cat") === cat); });
    document.querySelectorAll(".soon").forEach(function (t) { t.classList.toggle("on", t.getAttribute("data-cat") === cat); });
    var col = (document.querySelector('input[name="col-' + cat + '"]:checked') || {}).value;
    document.querySelectorAll(".colecao").forEach(function (s) { s.classList.toggle("on", s.getAttribute("data-col") === col && s.getAttribute("data-cat") === cat); });
  }

  // ---- tela da capa ----
  var ov = $("ov"), lastFocus = null;
  function open(colId, i, push) {
    var c = cols.filter(function (x) { return x.id === colId; })[0]; if (!c) return;
    var capa = c.capas[i], R = c.rotulo_item || "Capa";
    cur = { c: c, i: i, capa: capa, m: -1 };
    $("ov-col").textContent = c.nome;
    var cover = $("ov-cover"); cover.src = img(capa.imagem, 600); fallback(cover, capa.imagem); cover.alt = R + " " + pad(i + 1) + ", " + capa.nome;
    $("ov-num").textContent = $("ov-num2").textContent = R.toUpperCase() + " " + pad(i + 1);
    $("ov-nm").textContent = $("ov-nm2").textContent = capa.nome;
    $("ov-spec").textContent = c.especificacao || "";
    var hasM = c.miolos.length > 0;
    $("ov-ask-wrap").hidden = !hasM;
    $("ov-swap").hidden = c.miolos.length < 2;
    if (hasM) {
      $("ov-ask").textContent = c.pergunta_miolo || "Qual miolo você prefere?";
      $("ov-sub").textContent = c.subtitulo_miolo || "";
      $("ov-sub").hidden = !c.subtitulo_miolo;
      $("ov-opts").innerHTML = c.miolos.map(function (m, k) {
        return '<button type="button" class="opt" role="radio" aria-checked="false" data-k="' + k + '"><span class="t">' + esc(m.titulo) + '</span><span class="d">' + esc(m.descricao || "") + "</span></button>";
      }).join("");
      if (c.miolos.length === 1) pick(0);
    }
    ov.classList.remove("done");
    $("ov-confirm").disabled = hasM && cur.m < 0;
    $("ov-confirm").textContent = hasM ? "Confirmar" : "Continuar";
    ov.classList.add("open"); document.documentElement.classList.add("lock"); ov.scrollTop = 0;
    lastFocus = document.activeElement; $("ov-back").focus({ preventScroll: true });
    if (push) history.pushState({ ov: 1 }, "", "#" + c.id + "-" + (i + 1));
  }
  function pick(k) {
    cur.m = k;
    $("ov-opts").querySelectorAll(".opt").forEach(function (o) { var on = +o.getAttribute("data-k") === k; o.classList.toggle("sel", on); o.setAttribute("aria-checked", on); });
    $("ov-confirm").disabled = false;
  }
  function confirmStep() {
    var c = cur.c, m = c.miolos[cur.m], R = c.rotulo_item || "Capa", slides = [{ chip: R, src: cur.capa.imagem, alt: $("ov-cover").alt }];
    if (m && m.imagem) slides.push({ chip: "Miolo", src: m.imagem, alt: "Página do miolo " + (m.resumo || m.titulo), contain: true });
    (m && m.fotos_extras || []).forEach(function (f) { if (f && f.imagem) slides.push({ chip: "Miolo", src: f.imagem, alt: "Página do miolo", contain: true }); });
    var s = $("ov-slides");
    s.innerHTML = slides.map(function (x) {
      return '<div class="slide' + (x.contain ? " sl-mio" : "") + '" style="display:block"><span class="chip">' + x.chip + '</span><img src="' + esc(img(x.src, 900)) + '" data-src="' + esc(x.src) + '" alt="' + esc(x.alt) + '" decoding="async"></div>';
    }).join("");
    s.querySelectorAll("img").forEach(function (el) { fallback(el, el.getAttribute("data-src")); });
    $("ov-dots").innerHTML = slides.map(function (_, k) { return "<i" + (k ? "" : ' class="on"') + "></i>"; }).join("");
    $("ov-pick").textContent = m ? (m.resumo || m.titulo) : "";
    var produto = c.produto_no_pedido || c.nome;
    var txt = "Olá! Quero " + produto + ":\n• " + R + ": " + pad(cur.i + 1) + " · " + cur.capa.nome;
    if (m) txt += "\n• Miolo: " + (m.no_pedido || m.titulo);
    if (c.pedir_nome !== false) txt += "\n\n" + (c.texto_nome || "Nome para a capa") + ": ";
    $("ov-wa").href = wa(txt);
    ov.classList.add("done"); ov.scrollTop = 0;
    requestAnimationFrame(function () { s.scrollLeft = 0; sync(s); });
  }
  function close(fromPop) {
    if (!ov.classList.contains("open")) return;
    ov.classList.remove("open", "done"); document.documentElement.classList.remove("lock");
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    if (!fromPop && history.state && history.state.ov) history.back();
    else if (!fromPop && location.hash) history.replaceState(null, "", location.pathname + location.search);
  }
  $("ov-opts").addEventListener("click", function (e) { var o = e.target.closest(".opt"); if (o) pick(+o.getAttribute("data-k")); });
  $("ov-confirm").addEventListener("click", confirmStep);
  $("ov-swap").addEventListener("click", function () { ov.classList.remove("done"); ov.scrollTop = 0; });
  $("ov-back").addEventListener("click", function () { if (ov.classList.contains("done") && cur.c.miolos.length > 1) { ov.classList.remove("done"); return; } close(false); });
  window.addEventListener("popstate", function () { close(true); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(false); });

  // ---- carrossel ----
  function sync(s) {
    if (!s.clientWidth) return;
    var total = Math.round(s.scrollWidth / s.clientWidth), cur = Math.round(s.scrollLeft / s.clientWidth), gal = s.parentNode;
    gal.querySelectorAll(".dots i").forEach(function (d, k) { d.className = k === cur ? "on" : ""; });
    gal.querySelector(".nav.prev").hidden = cur <= 0;
    gal.querySelector(".nav.next").hidden = cur >= total - 1;
  }
  $("ov-slides").addEventListener("scroll", function (e) { sync(e.target); });
  document.querySelector(".gal").addEventListener("click", function (e) {
    var s = $("ov-slides"), btn = e.target.closest(".nav"), dot = e.target.closest(".dots i");
    if (btn) s.scrollTo({ left: s.scrollLeft + (btn.classList.contains("next") ? 1 : -1) * s.clientWidth, behavior: "smooth" });
    else if (dot) s.scrollTo({ left: Array.prototype.indexOf.call(dot.parentNode.children, dot) * s.clientWidth, behavior: "smooth" });
  });
  document.documentElement.classList.add("js"); document.querySelector(".page").classList.add("js"); ov.classList.add("js");
})();
</script>
<script>
(function(){
  var L1=document.getElementById("L1"),L2=document.getElementById("L2"),L3=document.getElementById("L3"),bar=document.getElementById("bar"),H=260,tick=false;
  var still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function upd(){
    tick=false;var y=scrollY;
    bar.classList.toggle("on",y>H-70);
    if(still||y>H+40)return;
    var p=Math.min(1,y/H);
    L1.style.transform="translate3d(0,"+(y*0.55)+"px,0) scale("+(1+p*0.06)+")";
    L2.style.transform="translate3d(0,"+(y*0.25)+"px,0)";
    L3.style.transform="translate3d(0,"+(y*0.4)+"px,0) scale("+(1-p*0.25)+")";
    L3.style.opacity=String(Math.max(0,1-p*1.5));
  }
  function rows(){
    if(still)return;var vh=innerHeight;
    document.querySelectorAll(".colecao.on .row .rh").forEach(function(h){var r=h.getBoundingClientRect();if(r.bottom<-50||r.top>vh+50)return;var d=(r.top-vh*0.5)/vh;h.style.transform="translate3d(0,"+(d*-14).toFixed(1)+"px,0)";});
  }
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(function(){upd();rows();});}},{passive:true});upd();
  if(still||!("IntersectionObserver" in window))return;
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}})},{rootMargin:"0px 0px -8% 0px"});
  function mark(){
    document.querySelectorAll(".cats,.tabs.on,.colecao.on .meta,.capas .capa,.soon.on").forEach(function(el){if(!el.classList.contains("rv")){el.classList.add("rv");io.observe(el);}});
    document.querySelectorAll(".row").forEach(function(r){r.querySelectorAll(".rs .capa").forEach(function(c,i){if(!c.classList.contains("rv")){c.classList.add("rv");c.style.setProperty("--d",Math.min(i,5)*90+"ms");io.observe(c);}});});
  }
  new MutationObserver(mark).observe(document.getElementById("cols"),{childList:true,subtree:true});
  mark();
})();
</script></body>
</html>
